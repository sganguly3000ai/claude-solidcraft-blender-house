<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="Arial, Helvetica, sans-serif">
<defs>
 <pattern id="cp" width="12" height="6" patternUnits="userSpaceOnUse"><rect width="12" height="6" fill="#4a4d52"/><path d="M0 0H12M0 0V6" stroke="#2c2e31" stroke-width="0.2"/></pattern>
 <pattern id="st" width="6" height="2" patternUnits="userSpaceOnUse"><rect width="6" height="2" fill="#b6ab95"/><path d="M0 0H6M0 1H6M2 0V1M4.6 1V2" stroke="#7d7464" stroke-width="0.12"/></pattern>
 <pattern id="tb" width="1" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="2" fill="#c08a52"/><path d="M0 0V2" stroke="#8a5d30" stroke-width="0.1"/></pattern>
</defs>
<style>
.o{fill:none;stroke:#000;stroke-width:0.35}
.g{fill:#d3e3ec;stroke:#1d1d1d;stroke-width:0.4}
.ob{fill:#e7eef2;stroke:#1d1d1d;stroke-width:0.4}
.m{fill:none;stroke:#1d1d1d;stroke-width:0.3}
.fa{fill:#232426;stroke:#000;stroke-width:0.2}
.sto{fill:url(#st);stroke:#000;stroke-width:0.25}
.lt{fill:#ffb52e;stroke:#7a4d00;stroke-width:0.1}
.tr{fill:#7fae6a;fill-opacity:0.35;stroke:#3f6a30;stroke-width:0.25}
.lv{fill:none;stroke:#000;stroke-width:0.15}
.d{fill:none;stroke:#000;stroke-width:0.15}
.lx{font-size:2.1px}
.dt{font-size:2.2px;text-anchor:middle}
.nt{font-size:2.4px}
.tg{fill:#fff;stroke:#000;stroke-width:0.25}
.tt{font-size:2.6px;font-weight:bold;text-anchor:middle}
</style>
<rect width="420" height="297" fill="#fff"/>
<rect x="10" y="10" width="400" height="277" fill="none" stroke="#000" stroke-width="0.5"/>

<!-- Viewed from the north (garden). Left = east. 1 m = 10 mm. Paper X = 265 - 10x, Y = 200 - 10z -->

<!-- GARAGE WING north face (y = 4.20, 5.80 behind the house's garden face) -->
<rect x="46" y="141" width="79" height="60.5" fill="url(#cp)"/>
<rect class="o" x="46" y="141" width="79" height="60.5"/>
<rect class="g" x="65" y="141" width="40" height="27"/><path class="m" d="M75 141V168M85 141V168M95 141V168"/>
<rect x="53" y="179" width="9" height="22.5" fill="#26282a" stroke="#000" stroke-width="0.3"/>
<!-- lower roof north fascia (y = 4.94), shared with the house -->
<rect class="fa" x="36" y="137" width="89" height="4"/>

<!-- HOUSE garden face (y = 10.00): charcoal panels, ground floor to +3.20, upper box to +6.50 -->
<rect x="125" y="135" width="140" height="66.5" fill="url(#cp)"/>
<rect class="o" x="125" y="135" width="140" height="66.5"/>
<!-- ground floor: living 4.80 sliding doors, dining 2.80 sliding doors, kitchen window -->
<rect class="g" x="208" y="172" width="48" height="28"/><path class="m" d="M220 172V200M232 172V200M244 172V200"/>
<rect class="g" x="171" y="172" width="28" height="28"/><path class="m" d="M185 172V200"/>
<rect class="g" x="138" y="172" width="20" height="17.5"/><path class="m" d="M148 172V189.5"/>
<!-- first floor: bedroom 2, bedroom 3, bathroom clerestory, study (sills +3.50, heads +6.40) -->
<rect class="g" x="229" y="136" width="26" height="29"/><path class="m" d="M242 136V165"/>
<rect class="g" x="186" y="136" width="27" height="29"/><path class="m" d="M199.5 136V165"/>
<rect class="ob" x="161" y="136" width="12" height="16"/>
<rect class="g" x="132" y="136" width="16" height="29"/>
<!-- upper roof fascia (1.20 overhang to the garden), timber soffit edge, downlights -->
<rect class="fa" x="119" y="131" width="152" height="4"/>
<rect x="119" y="135" width="6" height="0.6" fill="url(#tb)"/>
<g class="lt"><circle cx="150" cy="135.9" r="0.7"/><circle cx="130" cy="135.9" r="0.7"/></g>

<!-- COVERED GARDEN TERRACE (y = 13.90): roof +2.80 / +3.20 on two stone piers and a steel post -->
<rect class="sto" x="259" y="172" width="6" height="28.2"/>
<rect class="sto" x="165" y="172" width="6" height="28.2"/>
<rect x="214.25" y="172" width="1.5" height="28.2" fill="#26282a"/>
<path d="M216.6 172V201" stroke="#26282a" stroke-width="0.5"/>
<rect class="fa" x="162" y="168" width="109" height="4"/>
<rect x="162" y="200.2" width="109" height="1.3" fill="#e2e2dc" stroke="#000" stroke-width="0.2"/>
<g class="lt"><circle cx="249" cy="172.9" r="0.7"/><circle cx="231" cy="172.9" r="0.7"/><circle cx="199" cy="172.9" r="0.7"/><circle cx="181" cy="172.9" r="0.7"/></g>

<!-- small tree beside the terrace, low shrubs along the side path -->
<path d="M142 201.5V186" stroke="#5a4630" stroke-width="0.6"/>
<circle class="tr" cx="142" cy="175" r="12.5"/>

<!-- ground (garden −0.15) -->
<path d="M20 201.5H290" stroke="#000" stroke-width="0.6"/>

<!-- tags -->
<g>
 <circle class="tg" cx="220" cy="150" r="2.4"/><text class="tt" x="220" y="151">A</text>
 <circle class="tg" cx="115" cy="155" r="2.4"/><text class="tt" x="115" y="156">A</text>
 <circle class="tg" cx="168" cy="186" r="2.4"/><text class="tt" x="168" y="187">B</text>
 <circle class="tg" cx="262" cy="186" r="2.4"/><text class="tt" x="262" y="187">B</text>
 <path d="M161.5 173.5L163 172.2" stroke="#000" stroke-width="0.2"/><circle class="tg" cx="160" cy="176" r="2.4"/><text class="tt" x="160" y="177">C</text>
 <path d="M116.5 133H119" stroke="#000" stroke-width="0.2"/><circle class="tg" cx="114" cy="133" r="2.4"/><text class="tt" x="114" y="134">E</text>
</g>
<text x="215" y="206" font-size="1.8" text-anchor="middle">steel post + downpipe</text>
<text x="216" y="196" font-size="1.8" text-anchor="middle">covered terrace −0.02</text>
<text x="85" y="206" font-size="1.8" text-anchor="middle">garage wing beyond, side door to the side path</text>

<!-- levels -->
<g class="lv">
 <path d="M272 131H276M272 137H276M126 141H276M256 165H276M272 168H276M272 172H276M266 200H276" stroke-dasharray="1.5 1"/>
</g>
<g class="lx">
 <text x="278" y="131.7">Upper roof top +6.90</text>
 <text x="278" y="137.3">Lower roof top (garage) +6.30</text>
 <text x="278" y="141.7">Garage soffit, rec head +5.90</text>
 <text x="278" y="165.4">FF north sill +3.50</text>
 <text x="278" y="168.9">Terrace roof top +3.20</text>
 <text x="278" y="172.9">Soffit / GF head +2.80</text>
 <text x="278" y="201">±0.00 floor · garden −0.15</text>
 <text x="265" y="226" text-anchor="middle">W</text><text x="46" y="226" text-anchor="middle">E</text>
</g>

<!-- dimensions -->
<g class="d">
 <path d="M46 210H265M162 216H271"/>
 <path d="M45 211L47 209M124 211L126 209M264 211L266 209M161 217L163 215M270 217L272 215"/>
 <path d="M46 203V212M125 203V212M265 203V212M162 203V218M271 203V218"/>
 <path d="M30 200V131M29 201L31 199M29 173L31 171M29 169L31 167M29 136L31 134M29 132L31 130M27 200H33M27 172H33M27 168H33M27 135H33M27 131H33"/>
</g>
<text class="dt" x="85.5" y="208.8">7.90 garage wing</text>
<text class="dt" x="195" y="208.8">14.00 house</text>
<text class="dt" x="216.5" y="214.8">10.90 terrace roof</text>
<text class="dt" transform="translate(28.6 186) rotate(-90)">2.80</text>
<text class="dt" font-size="1.4" transform="translate(28.6 170) rotate(-90)">0.40</text>
<text class="dt" transform="translate(28.6 151.5) rotate(-90)">3.30</text>
<text class="dt" font-size="1.4" transform="translate(28.6 133) rotate(-90)">0.40</text>

<text x="150" y="238" font-size="5" font-weight="bold" text-anchor="middle">NORTH ELEVATION (GARDEN)  1:100</text>

<g class="nt">
 <text x="300" y="50" font-weight="bold" font-size="3">NOTES</text>
 <text x="300" y="56">The upper box (top +6.90) cantilevers 1.20</text>
 <text x="300" y="60">over the garden face; the terrace roof</text>
 <text x="300" y="64">(+2.80 soffit) extends 3.90 off the living</text>
 <text x="300" y="68">and dining rooms on two stone piers and a</text>
 <text x="300" y="72">slim steel post.</text>
 <text x="300" y="76">Big glass doors: 4.80 living, 2.80 dining.</text>
 <text x="300" y="80">Bedroom sills +3.50: they clear the terrace</text>
 <text x="300" y="84">roof upstand, so it cannot be walked onto.</text>
 <text x="300" y="88">The garage wing (left) sits 5.80 further</text>
 <text x="300" y="92">back, under the same +6.30 roof line.</text>
 <text x="300" y="102" font-weight="bold" font-size="3">MATERIALS</text>
 <rect x="300" y="105" width="8" height="4" fill="url(#cp)" stroke="#000" stroke-width="0.15"/><text x="310" y="108.2">A  charcoal panel cladding</text>
 <rect x="300" y="111" width="8" height="4" fill="url(#st)" stroke="#000" stroke-width="0.15"/><text x="310" y="114.2">B  split-face stone (terrace piers)</text>
 <rect x="300" y="117" width="8" height="4" fill="url(#tb)" stroke="#000" stroke-width="0.15"/><text x="310" y="120.2">C  timber soffits, warm downlights</text>
 <rect x="300" y="123" width="8" height="4" fill="#232426" stroke="#000" stroke-width="0.15"/><text x="310" y="126.2">E  dark aluminium frames, fascias, post</text>
</g>

<g stroke="#000" stroke-width="0.2">
 <rect x="300" y="236" width="10" height="2" fill="#000"/><rect x="310" y="236" width="10" height="2" fill="#fff"/><rect x="320" y="236" width="10" height="2" fill="#000"/><rect x="330" y="236" width="10" height="2" fill="#fff"/><rect x="340" y="236" width="10" height="2" fill="#000"/>
</g>
<g font-size="2.2" text-anchor="middle"><text x="300" y="242">0</text><text x="310" y="242">1</text><text x="320" y="242">2</text><text x="330" y="242">3</text><text x="340" y="242">4</text><text x="350" y="242">5 m</text></g>

<rect x="300" y="248" width="105" height="34" fill="none" stroke="#000" stroke-width="0.35"/>
<path d="M300 257H405M300 266H405M300 274H405" stroke="#000" stroke-width="0.2"/>
<text x="303" y="254.5" font-size="3.2" font-weight="bold">FAMILY HOUSE v3 · dark modern · 394 m² gross</text>
<text x="303" y="263" font-size="3.2" font-weight="bold">05  NORTH ELEVATION</text>
<text x="303" y="271.5" font-size="2.6">Scale 1:100 at A3 · levels in metres</text>
<text x="303" y="279.5" font-size="2.6">2026-10-23 · Rev C · concept design, not for construction</text>
</svg>
