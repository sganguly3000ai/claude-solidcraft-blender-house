<rect class="c" x="200" y="200.2" width="39" height="2"/>
<rect class="o" x="230.5" y="202.2" width="4.5" height="3"/>

<!-- SOUTH WALL (cut through the front door): pivot door to +2.80, wall above to +5.90 -->
<rect x="100.4" y="172" width="0.6" height="28" fill="#26282a"/>
<rect class="c" x="100" y="141" width="3" height="31"/>
<!-- BALCONY / PORCH ROOF: slab +2.80 to +3.20, deck +3.15, glass balustrade 1.10, timber soffit with downlight -->
<rect class="c" x="79" y="168" width="21" height="4"/>
<path d="M79 168.5H100" stroke="#777" stroke-width="0.3"/>
<rect x="79" y="157.5" width="0.6" height="10.5" fill="#bcd6e3" stroke="#3d86b5" stroke-width="0.2"/>
<path class="tb" d="M79 172.3H100"/>
<g class="lt"><circle cx="89.5" cy="172.8" r="0.6"/></g>
<!-- FIRST-FLOOR SLAB (floor zone +2.80 to +3.20) -->
<rect class="c" x="103" y="168" width="94" height="4"/>
<!-- LOWER ROOF (y -1.50 to 4.94): +5.90 to +6.30, 1.50 overhang to the street, timber soffit and downlight -->
<rect class="c" x="85" y="137" width="64.4" height="4"/>
<path class="tb" d="M85 141.3H100"/>
<g class="lt"><circle cx="92.5" cy="141.8" r="0.6"/></g>
<!-- STEP WALL F-STEP and UPPER ROOF (y 4.94 to 11.20): +6.50 to +6.90, 1.20 overhang to the garden -->
<rect class="c" x="147.9" y="135" width="3" height="6"/>
<rect class="c" x="149.4" y="131" width="62.6" height="4"/>
<path class="tb" d="M200 135.3H212"/>
<path class="m" d="M150.9 136H197" stroke-dasharray="1 0.6"/>
<!-- NORTH WALL (cut between the two garden doors): wall to +3.50, bedroom 3 window to +6.40 -->
<rect class="c" x="197" y="165" width="3" height="36.5"/>
<rect x="198.2" y="136" width="0.6" height="29" fill="#bcd6e3" stroke="#1d1d1d" stroke-width="0.2"/>
<rect class="c" x="197" y="135" width="3" height="1"/>
<!-- GARDEN TERRACE ROOF (y 10.00 to 13.90): +2.80 to +3.20, steel beam at y 13.30, timber soffit, downlights -->
<rect class="c" x="200" y="168" width="39" height="4"/>
<rect x="231.5" y="168.6" width="3" height="2.6" fill="#333"/>
<path class="tb" d="M200 172.3H239"/>
<g class="lt"><circle cx="213" cy="172.8" r="0.6"/><circle cx="226" cy="172.8" r="0.6"/></g>
<path d="M200 167H201.5V168" fill="none" stroke="#000" stroke-width="0.3"/>
<!-- INTERIOR WALLS CUT (above doors where the cut passes through a doorway) -->
<rect class="c" x="148.8" y="172" width="1.2" height="7"/>
<rect class="c" x="125.8" y="141" width="1.2" height="27"/>
<rect class="c" x="148.8" y="141" width="1.2" height="6"/>
<rect class="c" x="161.2" y="136" width="1.2" height="11"/>

