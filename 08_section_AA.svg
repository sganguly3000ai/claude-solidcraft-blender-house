<text class="dt" x="73" y="212.8" font-size="1.8">1.20</text>
<text class="dt" x="89.5" y="212.8">2.10</text>
<text class="dt" x="150" y="212.8">10.00</text>
<text class="dt" x="219.5" y="212.8">3.90</text>
<text class="dt" transform="translate(48.6 186) rotate(-90)">2.80</text>
