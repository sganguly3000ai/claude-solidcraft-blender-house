<rect x="230" y="172" width="6" height="28.2" fill="url(#st)" stroke="#888" stroke-width="0.2"/>
<rect x="232.25" y="172" width="1.5" height="28.2" fill="#555"/>

<!-- GROUND: forecourt −0.60, steps, porch ±0.00; garden −0.15 -->
<path d="M50 206H67M239 201.5H250" stroke="#000" stroke-width="0.6"/>
<polygon class="c" points="67,206 67,204.5 71,204.5 71,203 75,203 75,201.5 79,201.5 79,200 79,208 67,208"/>
<g class="lt"><rect x="66.6" y="204.9" width="0.4" height="0.8"/><rect x="70.6" y="203.4" width="0.4" height="0.8"/><rect x="74.6" y="201.9" width="0.4" height="0.8"/><rect x="78.6" y="200.4" width="0.4" height="0.8"/></g>
<rect class="c" x="79" y="200" width="21" height="2"/>
