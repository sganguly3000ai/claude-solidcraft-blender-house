<text class="sm" x="234" y="166" fill="#555">beam</text>
<text class="sm" x="123" y="133.5">roof step +6.30 / +6.90</text>

<!-- levels -->
<g class="lv"><path d="M213 131H246M150 137H246M201 141H246M80 157.5H246M240 168H246M240 172H246M240 200H246M240 206H246" stroke-dasharray="1.5 1"/></g>
<g class="lx">
 <text x="248" y="131.7">Upper roof top +6.90</text>
 <text x="248" y="137.3">Lower roof top +6.30</text>
 <text x="248" y="141.9">Lower roof soffit / ceiling +5.90</text>
 <text x="248" y="158.2">Balustrade top +4.25</text>
 <text x="248" y="168.4">First floor, terrace roof top +3.20</text>
