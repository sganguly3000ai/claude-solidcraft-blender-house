<text x="150" y="238" font-size="5" font-weight="bold" text-anchor="middle">SECTION A–A THROUGH THE ENTRY, HOUSE AND TERRACE (LOOKING WEST)  1:100</text>

<g class="nt">
 <text x="300" y="50" font-weight="bold" font-size="3">NOTES</text>
 <text x="300" y="56">Cut at x = 5.80 m, see the plans. Hatched =</text>
 <text x="300" y="60">cut; grey = seen beyond (west of the cut).</text>
 <text x="300" y="64">From the street: forecourt −0.60, 4 lit risers</text>
 <text x="300" y="68">x 150, porch ±0.00 under the balcony slab</text>
 <text x="300" y="72">(soffit +2.80, deck +3.15, glass to +4.25).</text>
 <text x="300" y="76">Lower roof +6.30 cantilevers 1.50 to the</text>
 <text x="300" y="80">street; it steps up to the upper roof (+6.90)</text>
 <text x="300" y="84">at the landing wall (F-STEP, steel beam).</text>
 <text x="300" y="88">Ceilings: GF 2.80; FF south rooms 2.70;</text>
 <text x="300" y="92">FF north rooms 3.20 (ceiling +6.40).</text>
 <text x="300" y="96">Garden terrace roof: 3.90 deep, steel beam</text>
 <text x="300" y="100">on stone piers and a post, 0.60 cantilever.</text>
 <text x="300" y="104">Orange = warm LED downlights in the timber</text>
 <text x="300" y="108">soffits and riser lights in the steps.</text>
 <text x="300" y="112">The garage stair section of v2 is unchanged</text>
 <text x="300" y="116">(15 R x 190, 14 G x 250); the garage and rec</text>
 <text x="300" y="120">room are now 3.20 high inside under the</text>
 <text x="300" y="124">shared +6.30 roof (rec room ceiling +5.90).</text>
 <text x="300" y="128">Structure shown is indicative: engineer to</text>
 <text x="300" y="132">design all cantilevers, beams and footings.</text>
</g>

