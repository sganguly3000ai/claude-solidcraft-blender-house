<rect width="420" height="297" fill="#fff"/>
<rect x="10" y="10" width="400" height="277" fill="none" stroke="#000" stroke-width="0.5"/>

<!-- Cut at x = 5.80 m (through the front door, hall, living room, bedroom 3 and the garden terrace), looking west. Left = south.
     Paper X = 100 + 10y, Y = 200 - 10z. Hatched = cut. Grey = seen beyond the cut (west of it) -->

<!-- BEYOND: small tree and clipped shrub in bed P1, bed P1 edge, stone cheek wall of the entry -->
<path d="M70.5 202V185" stroke="#8a7a66" stroke-width="0.5"/>
<circle cx="70.5" cy="176" r="9" fill="#cfe0c4" stroke="#8aa57c" stroke-width="0.2"/>
<circle cx="71" cy="195.5" r="3.5" fill="#cfe0c4" stroke="#8aa57c" stroke-width="0.2"/>
<rect x="67" y="201.5" width="12" height="4.5" fill="url(#st)" stroke="#888" stroke-width="0.2"/>
<rect x="79" y="172" width="21" height="28" fill="url(#st)" stroke="#888" stroke-width="0.2"/>
<!-- BEYOND: main stair (x 4.00-5.10), 16 risers x 200, 15 goings x 240, rising north -->
<polygon class="bg" points="114,200 114,198 116.4,198 116.4,196 118.8,196 118.8,194 121.2,194 121.2,192 123.6,192 123.6,190 126,190 126,188 128.4,188 128.4,186 130.8,186 130.8,184 133.2,184 133.2,182 135.6,182 135.6,180 138,180 138,178 140.4,178 140.4,176 142.8,176 142.8,174 145.2,174 145.2,172 147.6,172 147.6,170 150,170 150,172.5 118,200"/>
