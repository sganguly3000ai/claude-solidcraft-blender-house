<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="Arial, Helvetica, sans-serif">
<defs>
 <pattern id="h" width="1.2" height="1.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V1.2" stroke="#000" stroke-width="0.25"/></pattern>
 <pattern id="st" width="6" height="2" patternUnits="userSpaceOnUse"><rect width="6" height="2" fill="#d6cfc1"/><path d="M0 0H6M0 1H6M2 0V1M4.6 1V2" stroke="#a49b8b" stroke-width="0.12"/></pattern>
</defs>
<style>
.c{fill:url(#h);stroke:#000;stroke-width:0.4}
.o{fill:#fff;stroke:#000;stroke-width:0.3}
