<g class="nt">
 <text x="300" y="50" font-weight="bold" font-size="3">NOTES</text>
 <text x="300" y="56">House first floor +3.20, rec room +2.70.</text>
 <text x="300" y="60">Flat ceilings: +5.90 in the south rooms</text>
 <text x="300" y="64">(lower roof), +6.40 in the north rooms and</text>
 <text x="300" y="68">landing (upper roof). The roof steps up on</text>
 <text x="300" y="72">the red dashed line (wall F-STEP).</text>
 <text x="300" y="76">South windows: floor-to-ceiling, +3.20 to</text>
 <text x="300" y="80">+5.90; fixed laminated lower panes.</text>
 <text x="300" y="84">North windows: sill +3.50, head +6.40.</text>
 <text x="300" y="88">Rec room windows: +3.20 to +5.90 (same</text>
 <text x="300" y="92">band as the house).</text>
 <text x="300" y="96">Balcony: off the flex room, 2.10 deep,</text>
