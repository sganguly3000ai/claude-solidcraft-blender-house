<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="Arial, Helvetica, sans-serif">
<defs>
 <pattern id="dk" width="0.6" height="0.6" patternUnits="userSpaceOnUse"><rect width="0.6" height="0.6" fill="#e6e3dc"/><path d="M0 0H0.6M0 0V0.6" stroke="#aaa69c" stroke-width="0.012"/></pattern>
</defs>
<style>
.hid{fill:none;stroke:#666;stroke-width:0.02;stroke-dasharray:0.15 0.08}
.r1{fill:#d2d2d2;stroke:#000;stroke-width:0.08}
.r2{fill:#b4b4b4;stroke:#000;stroke-width:0.08}
.r3{fill:#e4e4e4;stroke:#000;stroke-width:0.06}
.fa{fill:none;stroke:#000;stroke-width:0.012}
.ar{fill:none;stroke:#000;stroke-width:0.025}
.ol{fill:#fff;stroke:#000;stroke-width:0.025}
.dl{fill:#f3b23a;stroke:#7a4d00;stroke-width:0.02}
.dh{fill:#fff3d0;stroke:#7a4d00;stroke-width:0.02}
.gl{fill:none;stroke:#3d86b5;stroke-width:0.06}
.d{fill:none;stroke:#000;stroke-width:0.15}
.rn{font-size:2.6px;font-weight:bold;text-anchor:middle}
.rd{font-size:2px;text-anchor:middle}
.dt{font-size:2.2px;text-anchor:middle}
.nt{font-size:2.4px}
</style>
<rect width="420" height="297" fill="#fff"/>
<rect x="10" y="10" width="400" height="277" fill="none" stroke="#000" stroke-width="0.5"/>

<!-- Geometry in metres = design.json / 1000. Paper X = 45 + 10x, Y = 165 - 10y (same as the plans) -->
<g transform="translate(45 165) scale(10 -10)">
 <!-- lowest first: garden terrace roof RF-3 (+3.20) and street balcony BA-1 (+3.15) -->
 <rect class="r3" x="-0.6" y="10" width="10.9" height="3.9"/>
 <rect x="0" y="-2.1" width="6.9" height="2.1" fill="url(#dk)" stroke="#000" stroke-width="0.04"/>
 <path class="gl" d="M0.05 -1.5V-2.05H6.85V-1.5"/>
 <!-- RF-3: fall to the north, box gutter behind the north fascia, downpipe at the post -->
 <path class="fa" d="M-0.5 13.8H10.2"/>
 <path class="ar" d="M2 12V13.4M7.5 12V13.4"/><polygon points="2,13.6 1.93,13.35 2.07,13.35"/><polygon points="7.5,13.6 7.43,13.35 7.57,13.35"/>
 <circle class="ol" cx="5" cy="13.75" r="0.1"/>
 <!-- piers, post and beam under RF-3 (hidden) -->
 <path class="hid" d="M0 13H0.6V13.6H0ZM9.4 13H10V13.6H9.4ZM4.925 13.225H5.075V13.375H4.925ZM0.3 13.3H9.7"/>

 <!-- RF-1: lower roof +6.30 over the south part of the house and the whole garage wing -->
 <polygon class="r1" points="-0.6,-1.5 12.7,-1.5 12.7,-3.9 22.9,-3.9 22.9,4.94 -0.6,4.94"/>
 <polygon class="fa" points="-0.5,-1.4 12.8,-1.4 12.8,-3.8 22.8,-3.8 22.8,4.84 -0.5,4.84"/>
 <!-- RF-2: upper roof +6.90 over the north part of the house -->
 <rect class="r2" x="-0.6" y="4.94" width="15.2" height="6.26"/>
 <rect class="fa" x="-0.5" y="5.04" width="15" height="6.06"/>

 <!-- walls below (hidden) -->
 <path class="hid" d="M0 -1.5V0H14V-1.5M13.7 -2.9V0M13.7 -2.9H21.9V4.2H14M0 0V10M14 0V10M0 10H14"/>

 <!-- outlets (internal) and falls 1:60 -->
 <g class="ol"><circle cx="2" cy="4.5" r="0.12"/><circle cx="11.5" cy="4.5" r="0.12"/><circle cx="16" cy="3.5" r="0.12"/><circle cx="20.5" cy="3.5" r="0.12"/><circle cx="3" cy="9.2" r="0.12"/><circle cx="11" cy="9.2" r="0.12"/></g>
 <path class="ar" d="M2 0.5V4.1M11.5 0.5V4.1M5.5 3.5H2.5M8 3.5H11M16 -2.5V3.1M20.5 -2.5V3.1M18.2 3.5H16.4M18.2 3.5H20.1M3 6V8.8M11 6V8.8M7 9.2H3.4M7 9.2H10.6"/>
 <g><polygon points="2,4.3 1.93,4.05 2.07,4.05"/><polygon points="11.5,4.3 11.43,4.05 11.57,4.05"/><polygon points="2.3,3.5 2.55,3.43 2.55,3.57"/><polygon points="11.2,3.5 10.95,3.43 10.95,3.57"/><polygon points="16,3.3 15.93,3.05 16.07,3.05"/><polygon points="20.5,3.3 20.43,3.05 20.57,3.05"/><polygon points="16.2,3.5 16.45,3.43 16.45,3.57"/><polygon points="20.3,3.5 20.05,3.43 20.05,3.57"/><polygon points="3,9 2.93,8.75 3.07,8.75"/><polygon points="11,9 10.93,8.75 11.07,8.75"/><polygon points="3.2,9.2 3.45,9.13 3.45,9.27"/><polygon points="10.8,9.2 10.55,9.13 10.55,9.27"/></g>

 <!-- soffit downlights, reflected (31 fittings, design.json soffit_lights) -->
 <g class="dl">
  <circle cx="0.9" cy="-0.75" r="0.11"/><circle cx="2.7" cy="-0.75" r="0.11"/><circle cx="4.5" cy="-0.75" r="0.11"/><circle cx="6.3" cy="-0.75" r="0.11"/><circle cx="8.1" cy="-0.75" r="0.11"/><circle cx="9.9" cy="-0.75" r="0.11"/><circle cx="11.7" cy="-0.75" r="0.11"/>
  <circle cx="13.2" cy="-3.4" r="0.11"/><circle cx="15.6" cy="-3.4" r="0.11"/><circle cx="18" cy="-3.4" r="0.11"/><circle cx="20.4" cy="-3.4" r="0.11"/><circle cx="22.4" cy="-3.4" r="0.11"/>
  <circle cx="22.4" cy="-1.4" r="0.11"/><circle cx="22.4" cy="0.6" r="0.11"/><circle cx="22.4" cy="2.6" r="0.11"/><circle cx="22.4" cy="4.4" r="0.11"/>
  <circle cx="13.2" cy="-2.4" r="0.11"/>
  <circle cx="1.6" cy="11.3" r="0.11"/><circle cx="3.4" cy="11.3" r="0.11"/><circle cx="6.6" cy="11.3" r="0.11"/><circle cx="8.4" cy="11.3" r="0.11"/>
  <circle cx="1.6" cy="12.6" r="0.11"/><circle cx="3.4" cy="12.6" r="0.11"/><circle cx="6.6" cy="12.6" r="0.11"/><circle cx="8.4" cy="12.6" r="0.11"/>
  <circle cx="11.5" cy="10.6" r="0.11"/><circle cx="13.5" cy="10.6" r="0.11"/>
 </g>
 <!-- porch / balcony soffit lights: under the balcony and the lower roof, so drawn pale -->
 <g class="dh"><circle cx="1.2" cy="-1.05" r="0.11"/><circle cx="2.6" cy="-1.05" r="0.11"/><circle cx="4.6" cy="-1.05" r="0.11"/><circle cx="5.8" cy="-1.05" r="0.11"/></g>
 <path d="M0 4.94H14" fill="none" stroke="#a33" stroke-width="0.05"/>
</g>

<!-- labels -->
<g>
 <text class="rn" x="100" y="140">LOWER ROOF RF-1  top +6.30</text>
 <text class="rd" x="100" y="143.4">house south part + whole garage wing: one roof, one fascia line</text>
 <text class="rd" x="100" y="146.4">membrane on tapered insulation, falls 1:60 to 4 internal outlets</text>
 <text class="rd" x="218" y="155" font-size="1.8">garage wing part of RF-1 (rec room ceiling +5.90)</text>
 <text class="rn" x="110" y="88">UPPER ROOF RF-2  top +6.90</text>
 <text class="rd" x="110" y="91.4">the "top box": 0.60 higher, over the landing and north rooms</text>
 <text class="rd" x="110" y="94.4">falls 1:60 to 2 internal outlets</text>
 <text class="rd" x="45" y="111.6" font-size="1.6" text-anchor="start" fill="#a33">step +6.30 / +6.90 (wall F-STEP, 200 upstand)</text>
 <text class="rn" x="85" y="34" font-size="2.2">TERRACE ROOF RF-3  top +3.20</text>
 <text class="rd" x="85" y="37" font-size="1.6">falls 1:60 north to a box gutter; downpipe at the steel post</text>
 <text class="rd" x="80" y="185" font-size="1.6">BALCONY BA-1 deck +3.15 (inner 1.50 under RF-1)</text>
 <text class="rd" x="200" y="170" font-size="1.6">fascias 400 deep, charcoal aluminium, on every roof</text>
</g>

<!-- dimensions -->
<g class="d">
 <path d="M39 214H274M38 215L40 213M273 215L275 213M39 205V216M274 205V216"/>
 <path d="M226 194V204M225 195L227 193M225 205L227 203"/>
 <path d="M264 158H274M263 159L265 157M273 159L275 157"/>
 <path d="M150 165V180M149 166L151 164M149 181L151 179"/>
