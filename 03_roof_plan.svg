 <path d="M175 65V53M174 66L176 64M174 54L176 52"/>
 <path d="M200 115.6V53M199 116.6L201 114.6M199 54L201 52M192 115.6H202M192 53H202"/>
 <path d="M39 14H191M38 15L40 13M190 15L192 13M39 12V26M191 12V54"/>
 <path d="M39 20H148M38 21L40 19M147 21L149 19M148 18V26"/>
