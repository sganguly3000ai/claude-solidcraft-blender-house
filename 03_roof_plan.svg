 <path d="M30 180V115.6M29 181L31 179M29 116.6L31 114.6M28 180H38M28 115.6H38"/>
</g>
<g>
 <text class="dt" x="156" y="212.8">23.50 lower roof RF-1 (house + garage wing)</text>
 <text class="dt" transform="translate(224.6 199) rotate(-90)" font-size="1.8">1.00</text>
 <text class="dt" x="269" y="156.8" font-size="1.8">1.00</text>
 <text class="dt" transform="translate(148.6 172.5) rotate(-90)" font-size="1.8">1.50</text>
 <text class="dt" x="42" y="98.8" font-size="1.6">0.60</text><text class="dt" x="42" y="138.8" font-size="1.6">0.60</text>
 <text class="dt" transform="translate(173.6 59) rotate(-90)" font-size="1.8">1.20</text>
 <text class="dt" transform="translate(198.6 84.3) rotate(-90)">6.26</text>
 <text class="dt" x="115" y="12.8">15.20 upper roof RF-2</text>
 <text class="dt" x="93.5" y="18.8" font-size="1.8">10.90 terrace roof</text>
 <text class="dt" transform="translate(28.6 45.5) rotate(-90)">3.90</text>
 <text class="dt" transform="translate(278.6 160) rotate(-90)">8.84</text>
 <text class="dt" transform="translate(28.6 148) rotate(-90)">6.44</text>
</g>

<text x="150" y="232" font-size="5" font-weight="bold" text-anchor="middle">ROOF PLAN  1:100</text>

<g transform="translate(392 28)">
 <circle r="8" fill="none" stroke="#000" stroke-width="0.35"/>
 <polygon points="0,-10 3.6,6 0,3 -3.6,6" fill="#000"/>
 <text y="-11.5" font-size="3.6" font-weight="bold" text-anchor="middle">N</text>
</g>

<g class="nt">
 <text x="300" y="50" font-weight="bold" font-size="3">NOTES</text>
 <text x="300" y="56">All roofs flat, single-ply membrane on</text>
 <text x="300" y="60">tapered insulation, 400 thick at the edge.</text>
 <text x="300" y="64">Three stacked plates: terrace roof +3.20,</text>
 <text x="300" y="68">lower roof +6.30 (house + garage share it),</text>
 <text x="300" y="72">upper roof +6.90.</text>
 <text x="300" y="76">Overhangs: street 1.50 (house), 1.00 (garage</text>
 <text x="300" y="80">S, E, W), 0.74 (garage N), 0.60 (W, E),</text>
 <text x="300" y="84">1.20 (upper roof to the garden).</text>
 <text x="300" y="88">Soffits: oiled timber boards, downlights.</text>
 <text x="300" y="92">No gutters on the fascias: internal outlets,</text>
 <text x="300" y="96">downpipes boxed in the walls (sizes and</text>
 <text x="300" y="100">routes by the engineer / plumber).</text>
 <text x="300" y="104">Cantilevers need an engineer: see README.</text>
 <text x="300" y="116" font-weight="bold" font-size="3">LEGEND</text>
 <circle cx="304" cy="120" r="1.1" fill="#f3b23a" stroke="#7a4d00" stroke-width="0.2"/><text x="308" y="120.8">downlight in a soffit (reflected), 31 in all</text>
 <circle cx="304" cy="124.5" r="1.1" fill="#fff3d0" stroke="#7a4d00" stroke-width="0.2"/><text x="308" y="125.3">same, under the balcony (porch ceiling)</text>
 <circle cx="304" cy="129" r="1.2" fill="#fff" stroke="#000" stroke-width="0.25"/><text x="308" y="129.8">rainwater outlet</text>
 <path d="M300.5 133.5H306" stroke="#000" stroke-width="0.25"/><polygon points="307,133.5 305,132.8 305,134.2"/><text x="308" y="134.3">fall 1:60</text>
 <path d="M300.5 138H307" stroke="#666" stroke-width="0.2" stroke-dasharray="1.5 0.8"/><text x="308" y="138.8">wall, pier, post or beam below</text>
 <path d="M300.5 142.5H307" stroke="#3d86b5" stroke-width="0.6"/><text x="308" y="143.3">glass balustrade</text>
</g>

<g stroke="#000" stroke-width="0.2">
 <rect x="300" y="236" width="10" height="2" fill="#000"/><rect x="310" y="236" width="10" height="2" fill="#fff"/><rect x="320" y="236" width="10" height="2" fill="#000"/><rect x="330" y="236" width="10" height="2" fill="#fff"/><rect x="340" y="236" width="10" height="2" fill="#000"/>
</g>
