<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="Arial, Helvetica, sans-serif">
<defs>
 <pattern id="cp" width="12" height="6" patternUnits="userSpaceOnUse"><rect width="12" height="6" fill="#4a4d52"/><path d="M0 0H12M0 0V6" stroke="#2c2e31" stroke-width="0.2"/></pattern>
 <pattern id="st" width="6" height="2" patternUnits="userSpaceOnUse"><rect width="6" height="2" fill="#b6ab95"/><path d="M0 0H6M0 1H6M2 0V1M4.6 1V2" stroke="#7d7464" stroke-width="0.12"/></pattern>
 <pattern id="tb" width="1" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="2" fill="#c08a52"/><path d="M0 0V2" stroke="#8a5d30" stroke-width="0.1"/></pattern>
</defs>
<style>
.o{fill:none;stroke:#000;stroke-width:0.35}
.g{fill:#d3e3ec;stroke:#1d1d1d;stroke-width:0.4}
.m{fill:none;stroke:#1d1d1d;stroke-width:0.3}
.fa{fill:#232426;stroke:#000;stroke-width:0.2}
.gb{fill:#bcd6e3;fill-opacity:0.45;stroke:#3d86b5;stroke-width:0.3}
.sto{fill:url(#st);stroke:#000;stroke-width:0.25}
.lt{fill:#ffb52e;stroke:#7a4d00;stroke-width:0.1}
.tr{fill:#7fae6a;fill-opacity:0.4;stroke:#3f6a30;stroke-width:0.25}
.sh{fill:#6f9a58;fill-opacity:0.85;stroke:#3f6a30;stroke-width:0.2}
.lv{fill:none;stroke:#000;stroke-width:0.15}
.d{fill:none;stroke:#000;stroke-width:0.15}
.lx{font-size:2.1px}
.dt{font-size:2.2px;text-anchor:middle}
.nt{font-size:2.4px}
.tg{fill:#fff;stroke:#000;stroke-width:0.25}
.tt{font-size:2.6px;font-weight:bold;text-anchor:middle}
</style>
<rect width="420" height="297" fill="#fff"/>
<rect x="10" y="10" width="400" height="277" fill="none" stroke="#000" stroke-width="0.5"/>

<!-- Viewed from the west. Left = north (garden), right = south (street). 1 m = 10 mm. Paper X = 180 - 10y, Y = 200 - 10z -->

<!-- FARTHEST: small tree in the garden, east of the terrace -->
<path d="M54 201.5V187" stroke="#5a4630" stroke-width="0.6"/>
<circle class="tr" cx="54" cy="175" r="12.5" style="fill-opacity:0.25"/>

<!-- GARAGE WING west face (x = 13.70), in front of the house: stone below +2.70, charcoal above, rec room west window -->
<rect x="180" y="173" width="29" height="28.5" fill="url(#st)"/>
<rect x="180" y="141" width="29" height="32" fill="url(#cp)"/>
<rect class="o" x="180" y="141" width="29" height="60.5"/>
<rect class="g" x="183" y="141" width="20" height="27"/><path class="m" d="M193 141V168"/>
<!-- garage roof west overhang (1.00) fascia, downlight in the crook -->
<rect class="fa" x="195" y="137" width="24" height="4"/>
<g class="lt"><circle cx="204" cy="141.9" r="0.7"/></g>

<!-- ENTRY: stone cheek wall (x = 3.60) seen under the balcony -->
<rect class="sto" x="180" y="172" width="21" height="29.5"/>

<!-- HOUSE west face (x = 0): south part to +5.90 under the lower roof, north part to +6.50 under the upper roof -->
<polygon points="80,201.5 180,201.5 180,141 130.6,141 130.6,135 80,135" fill="url(#cp)" stroke="#000" stroke-width="0.35"/>
<rect class="g" x="146" y="172" width="14" height="28"/>
<rect class="g" x="93" y="172" width="24" height="28"/><path class="m" d="M105 172V200"/>
<rect class="g" x="146" y="141" width="14" height="27"/>
<rect class="g" x="120.4" y="136" width="8" height="32"/>
<rect class="g" x="93" y="136" width="14" height="29"/>
<!-- roof fascias: upper (y 4.94 to 11.20) and lower (y -1.50 to 4.94), both 0.60 overhang to the west -->
<rect class="fa" x="68" y="131" width="62.6" height="4"/>
<rect class="fa" x="130.6" y="137" width="64.4" height="4"/>
<rect x="130.6" y="141" width="8" height="0.6" fill="url(#tb)"/>

<!-- GARDEN TERRACE roof (x = -0.60) on the north-west stone pier -->
<rect class="sto" x="44" y="172" width="6" height="28.2"/>
<rect class="fa" x="41" y="168" width="39" height="4"/>
<rect x="41" y="200.2" width="39" height="1.3" fill="#e2e2dc" stroke="#000" stroke-width="0.2"/>
<g class="lt"><circle cx="67" cy="172.9" r="0.7"/><circle cx="54" cy="172.9" r="0.7"/></g>

<!-- STREET BALCONY west end (x = 0): fascia and frameless glass balustrade -->
<rect class="fa" x="180" y="168" width="21" height="4"/>
<rect class="gb" x="180" y="157.5" width="20.5" height="10.5"/>

<!-- bed P1 west edge on the side bank, gravel strip -->
<polygon class="sto" points="186,201.5 213,201.5 213,206 186,202.3"/>
<rect x="180" y="201.2" width="6" height="0.8" fill="#bdb6a6"/>
<!-- planting -->
<g class="sh"><ellipse cx="193" cy="199.5" rx="5" ry="2.5"/><circle cx="209" cy="195.5" r="3.5"/><ellipse cx="207" cy="199" rx="5" ry="3"/></g>
<path d="M209.5 202V185" stroke="#5a4630" stroke-width="0.6"/>
<circle class="tr" cx="209.5" cy="176" r="9"/>

<!-- ground: garden −0.15, side bank down to the street front −0.60 -->
<path d="M20 201.5H180L213 206H290" fill="none" stroke="#000" stroke-width="0.6"/>

<!-- tags -->
<g>
 <circle class="tg" cx="140" cy="155" r="2.4"/><text class="tt" x="140" y="156">A</text>
 <circle class="tg" cx="190" cy="186" r="2.4"/><text class="tt" x="190" y="187">B</text>
 <circle class="tg" cx="47" cy="186" r="2.4"/><text class="tt" x="47" y="187">B</text>
 <path d="M165 143.6V141.8" stroke="#000" stroke-width="0.2"/><circle class="tg" cx="165" cy="146" r="2.4"/><text class="tt" x="165" y="147">C</text>
 <circle class="tg" cx="190" cy="163" r="2.4"/><text class="tt" x="190" y="164">D</text>
 <path d="M66.5 133H68" stroke="#000" stroke-width="0.2"/><circle class="tg" cx="64" cy="133" r="2.4"/><text class="tt" x="64" y="134">E</text>
</g>
<text x="60" y="196" font-size="1.8" text-anchor="middle">covered terrace</text>
<text x="196" y="210" font-size="1.8" text-anchor="middle">bed P1 and side bank</text>

<!-- levels -->
<g class="lv">
 <path d="M220 137H232M210 141H232M202 157.5H232M202 168H232M202 172H232M214 206H232" stroke-dasharray="1.5 1"/>
 <path d="M131 131H232" stroke-dasharray="1.5 1"/>
</g>
<g class="lx">
 <text x="234" y="131.7">Upper roof top +6.90</text>
 <text x="234" y="137.3">Lower roof top +6.30</text>
 <text x="234" y="141.9">Lower soffit, FF head +5.90</text>
 <text x="234" y="158.2">Balustrade top +4.25</text>
 <text x="234" y="168.2">First floor +3.20</text>
 <text x="234" y="172.9">Soffits, GF head +2.80</text>
 <text x="234" y="206.7">Street front −0.60</text>
 <text x="20" y="199.5">Garden −0.15</text>
 <text x="40" y="226" text-anchor="middle">N</text><text x="219" y="226" text-anchor="middle">S</text>
</g>

<!-- dimensions -->
<g class="d">
 <path d="M41 214H80M80 214H180M180 214H201M180 220H209"/>
 <path d="M40 215L42 213M79 215L81 213M179 215L181 213M200 215L202 213M179 221L181 219M208 221L210 219"/>
 <path d="M41 208V216M80 208V216M180 208V222M201 208V216M209 208V222"/>
 <path d="M32 200V131M31 201L33 199M31 173L33 171M31 136L33 134M31 132L33 130M29 200H35M29 172H35M29 135H35M29 131H35"/>
</g>
<text class="dt" x="60.5" y="212.8">3.90 terrace</text>
<text class="dt" x="130" y="212.8">10.00 house</text>
<text class="dt" x="190.5" y="212.8" font-size="1.8">2.10</text>
<text class="dt" x="194.5" y="218.8" font-size="1.8">2.90 garage forward</text>
<text class="dt" transform="translate(30.6 186) rotate(-90)">2.80</text>
<text class="dt" transform="translate(30.6 153.5) rotate(-90)">3.70</text>
<text class="dt" font-size="1.4" transform="translate(30.6 133) rotate(-90)">0.40</text>

<text x="150" y="238" font-size="5" font-weight="bold" text-anchor="middle">WEST ELEVATION  1:100</text>

<g class="nt">
 <text x="300" y="50" font-weight="bold" font-size="3">NOTES</text>
 <text x="300" y="56">The stacked boxes in profile: terrace roof</text>
 <text x="300" y="60">(+3.20) on the left, upper box (+6.90) over</text>
 <text x="300" y="64">the north rooms, lower roof (+6.30) over the</text>
 <text x="300" y="68">south rooms, running on at the same height</text>
 <text x="300" y="72">over the garage wing (right, 2.90 forward).</text>
 <text x="300" y="76">The street balcony's glass end and the stone</text>
 <text x="300" y="80">cheek wall of the entry are seen on the right.</text>
 <text x="300" y="84">The ground falls 0.45 along the side bank</text>
 <text x="300" y="88">from the garden to the street front.</text>
 <text x="300" y="98" font-weight="bold" font-size="3">MATERIALS</text>
 <rect x="300" y="101" width="8" height="4" fill="url(#cp)" stroke="#000" stroke-width="0.15"/><text x="310" y="104.2">A  charcoal panel cladding</text>
 <rect x="300" y="107" width="8" height="4" fill="url(#st)" stroke="#000" stroke-width="0.15"/><text x="310" y="110.2">B  split-face stone</text>
 <rect x="300" y="113" width="8" height="4" fill="url(#tb)" stroke="#000" stroke-width="0.15"/><text x="310" y="116.2">C  timber soffits, warm downlights</text>
 <rect x="300" y="119" width="8" height="4" fill="#bcd6e3" stroke="#3d86b5" stroke-width="0.3"/><text x="310" y="122.2">D  frameless glass balustrade</text>
 <rect x="300" y="125" width="8" height="4" fill="#232426" stroke="#000" stroke-width="0.15"/><text x="310" y="128.2">E  dark aluminium frames and fascias</text>
</g>

<g stroke="#000" stroke-width="0.2">
 <rect x="300" y="236" width="10" height="2" fill="#000"/><rect x="310" y="236" width="10" height="2" fill="#fff"/><rect x="320" y="236" width="10" height="2" fill="#000"/><rect x="330" y="236" width="10" height="2" fill="#fff"/><rect x="340" y="236" width="10" height="2" fill="#000"/>
</g>
<g font-size="2.2" text-anchor="middle"><text x="300" y="242">0</text><text x="310" y="242">1</text><text x="320" y="242">2</text><text x="330" y="242">3</text><text x="340" y="242">4</text><text x="350" y="242">5 m</text></g>

<rect x="300" y="248" width="105" height="34" fill="none" stroke="#000" stroke-width="0.35"/>
<path d="M300 257H405M300 266H405M300 274H405" stroke="#000" stroke-width="0.2"/>
<text x="303" y="254.5" font-size="3.2" font-weight="bold">FAMILY HOUSE v3 · dark modern · 394 m² gross</text>
<text x="303" y="263" font-size="3.2" font-weight="bold">07  WEST ELEVATION</text>
<text x="303" y="271.5" font-size="2.6">Scale 1:100 at A3 · levels in metres</text>
<text x="303" y="279.5" font-size="2.6">2026-10-23 · Rev C · concept design, not for construction</text>
</svg>
